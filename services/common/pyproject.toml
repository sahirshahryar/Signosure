[project]
name = "signosure-common"
version = "1.0.0"
description = "Shared domain code for Signosure services (database models, auth, config)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beanie>=2.0.1",
    "fastapi>=0.118.0",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
]

# Unlike the services (which are run in place and never installed as
# dependencies), `common` is depended upon by other workspace members, so it
# must be a buildable package.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
